{% extends 'LandingPage.html' %} 
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/RegisterUser.css' %}">
{% endblock %}

{% block content %}
<div class="register-container">
    <div class="register-card">
        <h2 class="register-title">Create an Account</h2>
        <p class="register-subtitle">Please fill in your details to register</p>

        {% if error_message %}
            <div style="background-color: #fee2e2; color: #dc2626; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center;">
                {{ error_message }}
            </div>
        {% endif %}

        <form method="POST" action="{% url 'register' %}" class="register-form">
            {% csrf_token %}

            <div class="form-grid">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" name="first_name" placeholder="John" required>
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" name="last_name" placeholder="Doe" required>
                </div>

                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="johndoe123" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="john@example.com" required>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" name="phone_number" placeholder="+1234567890">
                </div>
                <div class="form-group">
                    <label>Country</label>
                    <input type="text" name="country_name" placeholder="Pakistan">
                </div>

                <div class="form-group">
                    <label>City</label>
                    <input type="text" name="city" placeholder="Lahore">
                </div>
                
                <div class="form-group full-width">
                    <label>Address</label>
                    <textarea name="address" rows="3" placeholder="Enter your complete address..." style="width: 100%; border: 1px solid #ccc; border-radius: 5px; padding: 10px;"></textarea>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Create a strong password" required>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" name="confirm_password" placeholder="Repeat your password" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">Register</button>
        </form>

        <p class="login-link">
            Already have an account? <a href="{% url 'login' %}">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
